{% extends "base.html" %}

{% block title %}Register | TrekConnect{% endblock %}

{% block content %}

<section class="auth-video-section register-video-section">

    <video
        class="auth-background-video"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
    >
        <source
            src="{{ url_for('static', filename='videos/register.mp4') }}"
            type="video/mp4"
        >

        Your browser does not support background videos.
    </video>

    <div class="auth-video-overlay"></div>

    <div class="container auth-page-content register-page-content">

        <div class="row justify-content-center align-items-center w-100">

            <div class="col-xl-6 col-lg-7 col-md-9">

                <div class="auth-card register-auth-card">

                    <div class="text-center mb-4">

                        <p class="auth-label mb-2">
                            BEGIN YOUR ADVENTURE
                        </p>

                        <h1 class="fw-bold mb-2">
                            Create an Account
                        </h1>

                        <p class="auth-description mb-0">
                            Register as a trekker or trek staff member.
                        </p>

                    </div>

                    <form
                        method="POST"
                        action="{{ url_for('register') }}"
                    >

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="name"
                                    class="form-label"
                                >
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control auth-form-control"
                                    id="name"
                                    name="name"
                                    placeholder="Enter your full name"
                                    autocomplete="name"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-3">

                                <label
                                    for="email"
                                    class="form-label"
                                >
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control auth-form-control"
                                    id="email"
                                    name="email"
                                    placeholder="Enter your email"
                                    autocomplete="email"
                                    required
                                >

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="contact"
                                    class="form-label"
                                >
                                    Contact Number
                                </label>

                                <input
                                    type="tel"
                                    class="form-control auth-form-control"
                                    id="contact"
                                    name="contact"
                                    placeholder="Enter your contact number"
                                    maxlength="15"
                                    autocomplete="tel"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-3">

                                <label
                                    for="role"
                                    class="form-label"
                                >
                                    Register As
                                </label>

                                <select
                                    class="form-select auth-form-control"
                                    id="role"
                                    name="role"
                                    required
                                >
                                    <option value="">
                                        Select account type
                                    </option>

                                    <option value="user">
                                        Trekker
                                    </option>

                                    <option value="staff">
                                        Trek Staff
                                    </option>
                                </select>

                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label
                                    for="password"
                                    class="form-label"
                                >
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control auth-form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Minimum 6 characters"
                                    minlength="6"
                                    autocomplete="new-password"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-4">

                                <label
                                    for="confirm_password"
                                    class="form-label"
                                >
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control auth-form-control"
                                    id="confirm_password"
                                    name="confirm_password"
                                    placeholder="Re-enter your password"
                                    minlength="6"
                                    autocomplete="new-password"
                                    required
                                >

                            </div>

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success auth-submit-button w-100"
                        >
                            Create Account
                        </button>

                    </form>

                    <div class="auth-divider">
                        <span>Already registered?</span>
                    </div>

                    <p class="text-center mb-0">

                        <a
                            href="{{ url_for('login') }}"
                            class="auth-page-link"
                        >
                            Login to your account
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
