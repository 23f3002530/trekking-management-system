{% extends "base.html" %}

{% block title %}Register | TrekConnect{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card border-0 shadow">
                    <div class="card-body p-4 p-md-5">

                        <h2 class="text-center fw-bold mb-2">
                            Create an Account
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Register as a trekker or trek staff member.
                        </p>

                        <form method="POST" action="{{ url_for('register') }}">

                            <div class="mb-3">
                                <label for="name" class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="contact" class="form-label">
                                    Contact Number
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="contact"
                                    name="contact"
                                    maxlength="15"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="role" class="form-label">
                                    Register As
                                </label>

                                <select
                                    class="form-select"
                                    id="role"
                                    name="role"
                                    required
                                >
                                    <option value="">
                                        Select account type
                                    </option>

                                    <option value="user">
                                        Trekker
                                    </option>

                                    <option value="staff">
                                        Trek Staff
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    minlength="6"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label for="confirm_password" class="form-label">
                                    Confirm Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirm_password"
                                    name="confirm_password"
                                    minlength="6"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-success w-100"
                            >
                                Create Account
                            </button>
                        </form>

                        <p class="text-center mt-4 mb-0">
                            Already have an account?

                            <a href="{{ url_for('login') }}">
                                Login here
                            </a>
                        </p>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
