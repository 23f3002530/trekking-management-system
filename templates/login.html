{% extends "base.html" %}

{% block title %}Login | TrekConnect{% endblock %}

{% block content %}

<section class="auth-video-section">

    <video
        class="auth-background-video"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
    >
        <source
            src="{{ url_for('static', filename='videos/login.mp4') }}"
            type="video/mp4"
        >

        Your Browser does not support background videos.
    </video>

    <div class="auth-video-overlay"></div>

    <div class="container auth-page-content">

        <div class="row justify-content-center align-items-center w-100">

            <div class="col-xl-5 col-lg-6 col-md-8">

                <div class="auth-card">

                    <div class="text-center mb-4">

                        <p class="auth-label mb-2">
                            WELCOME TO TREKCONNECT
                        </p>

                        <h1 class="fw-bold mb-2">
                            Welcome Back
                        </h1>

                        <p class="auth-description mb-0">
                            Log in to continue your trekking journey.
                        </p>

                    </div>

                    <form
                        method="POST"
                        action="{{ url_for('login') }}"
                    >

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                class="form-control auth-form-control"
                                id="email"
                                name="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >

                        </div>

                        <div class="mb-4">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control auth-form-control"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-success auth-submit-button w-100"
                        >
                            Login
                        </button>

                        
                        <div class="text-center mt-3">

                            <a
                                href="{{ url_for('forgot_password') }}"
                                class="auth-page-link"
                            >
                                Forgot Password?
                            </a>

                        </div>

                    </form>

                    <div class="auth-divider">
                        <span>New to TrekConnect?</span>
                    </div>

                    <p class="text-center mb-0">

                        <a
                            href="{{ url_for('register') }}"
                            class="auth-page-link"
                        >
                            Create an account
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
