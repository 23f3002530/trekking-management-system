{% extends "base.html" %}

{% block title %}Login | TrekConnect{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="card border-0 shadow">
                    <div class="card-body p-4 p-md-5">

                        <h2 class="text-center fw-bold mb-2">
                            Welcome Back
                        </h2>

                        <p class="text-center text-muted mb-4">
                            Login to access your TrekConnect account.
                        </p>

                        <form method="POST" action="{{ url_for('login') }}">

                            <div class="mb-3">
                                <label for="email" class="form-label">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    required
                                >
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    required
                                >
                            </div>

                            <button
                                type="submit"
                                class="btn btn-success w-100"
                            >
                                Login
                            </button>
                        </form>

                        <p class="text-center mt-4 mb-0">
                            Do not have an account?

                            <a href="{{ url_for('register') }}">
                                Register here
                            </a>
                        </p>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
